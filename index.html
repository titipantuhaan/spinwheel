<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Spin Wheel - Putar dan menangkan hadiah ikan menarik!">
<title>🎰 Spin Wheel - Win Fish Rewards!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --deep:#06223a; --sea:#0b4a6f; --teal:#12b5b0; --coral:#ff6b4a; --sand:#ffe3b0; --foam:#e9fbff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family:'Baloo 2', system-ui, sans-serif; color:var(--foam); text-align:center;
    background:radial-gradient(ellipse at 50% -10%, #1b79a8 0, var(--sea) 40%, var(--deep) 100%) fixed;
    display:flex; flex-direction:column; align-items:center; padding:20px 14px 40px; overflow-x:hidden;
  }
  h1 { margin:6px 0 0; font-size:clamp(28px, 8vw, 40px); font-weight:800; }
  .sub { margin:0 0 14px; opacity:.85; }
  .bubbles { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .bubbles i { position:absolute; bottom:-30px; border-radius:50%; border:2px solid rgba(255,255,255,.35); animation:rise linear infinite; }
  @keyframes rise { to { transform:translateY(-110vh); opacity:0; } }
  main { position:relative; z-index:1; width:100%; max-width:440px; }

  .wheel-wrap { position:relative; width:min(86vw, 380px); aspect-ratio:1; margin:8px auto 0; }
  canvas { width:100%; height:100%; display:block; filter:drop-shadow(0 12px 22px rgba(0,0,0,.45)); }
  .pointer {
    position:absolute; top:-12px; left:50%; width:0; height:0; transform:translateX(-50%); z-index:2;
    border-left:16px solid transparent; border-right:16px solid transparent; border-top:30px solid var(--coral);
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.5));
  }
  .hub {
    position:absolute; top:50%; left:50%; width:76px; height:76px; transform:translate(-50%,-50%);
    border-radius:50%; border:5px solid var(--sand); background:var(--coral); color:#fff;
    font:800 18px 'Baloo 2', sans-serif; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .hub:disabled { filter:grayscale(.5); cursor:default; }
  .hub:focus-visible, .btn:focus-visible { outline:3px solid #fff; outline-offset:3px; }

  .stats { display:flex; gap:10px; justify-content:center; margin:18px 0 8px; }
  .stat { background:rgba(255,255,255,.1); border-radius:14px; padding:6px 16px; min-width:110px; }
  .stat b { display:block; font-size:22px; color:var(--sand); }
  .history { list-style:none; margin:10px 0 0; padding:0; text-align:left; }
  .history li { background:rgba(255,255,255,.08); border-radius:12px; padding:8px 14px; margin-bottom:6px; display:flex; justify-content:space-between; }
  .history .empty { justify-content:center; opacity:.7; }

  .modal { position:fixed; inset:0; z-index:5; display:none; align-items:center; justify-content:center; background:rgba(3,15,28,.75); padding:20px; }
  .modal.show { display:flex; }
  .card { background:var(--foam); color:var(--deep); border-radius:24px; padding:26px 22px; width:100%; max-width:340px; animation:pop .5s cubic-bezier(.2,1,.3,1.3); }
  @keyframes pop { from { transform:scale(.6); opacity:0; } }
  .card .big { font-size:72px; line-height:1; }
  .card h2 { margin:6px 0 2px; font-size:28px; }
  .btn { margin-top:14px; border:0; border-radius:14px; background:var(--coral); color:#fff; font:800 18px 'Baloo 2', sans-serif; padding:10px 28px; cursor:pointer; }
  @media (prefers-reduced-motion: reduce) { .bubbles { display:none; } .card { animation:none; } }
</style>
</head>
<body>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>
<main>
  <h1>🎰 Spin Wheel</h1>
  <p class="sub">Putar rodanya, menangkan hadiah ikan!</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="760" height="760" aria-label="Roda hadiah ikan"></canvas>
    <button class="hub" id="spin">PUTAR</button>
  </div>

  <div class="stats">
    <div class="stat">Total putaran<b id="count">0</b></div>
    <div class="stat">Hadiah ikan<b id="wins">0</b></div>
  </div>
  <ul class="history" id="history"></ul>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <div class="big" id="mIcon"></div>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <button class="btn" id="mClose">Tutup</button>
  </div>
</div>

<script>
// === ATUR HADIAH DI SINI === (weight = peluang relatif, makin besar makin sering keluar)
var PRIZES = [
  { icon:'🐟', name:'Ikan Lele',    weight:22, color:'#12b5b0' },
  { icon:'🐠', name:'Ikan Nemo',    weight:16, color:'#ff8a3d' },
  { icon:'🦐', name:'Udang',        weight:16, color:'#f45b69' },
  { icon:'🐡', name:'Ikan Buntal',  weight:12, color:'#f2c14e' },
  { icon:'🦀', name:'Kepiting',     weight:10, color:'#e4572e' },
  { icon:'🦑', name:'Cumi-cumi',    weight:8,  color:'#7b6cd9' },
  { icon:'🦈', name:'Ikan Hiu',     weight:4,  color:'#3d85c6' },
  { icon:'🐳', name:'Paus Emas',    weight:2,  color:'#d4a017' },
];
var ZONK = false; // ubah ke true kalau mau ada segmen "Zonk" (tambahkan sendiri di PRIZES)

var cv = document.getElementById('wheel'), ctx = cv.getContext('2d');
var N = PRIZES.length, SEG = 2 * Math.PI / N, rot = 0, spinning = false;
var state = { count:0, wins:0, history:[] };

try { var saved = JSON.parse(localStorage.getItem('spin-state')); if (saved) state = saved; } catch (e) {}
function save() { try { localStorage.setItem('spin-state', JSON.stringify(state)); } catch (e) {} }

function draw() {
  var s = cv.width, c = s / 2, r = c - 14;
  ctx.clearRect(0, 0, s, s);
  ctx.save(); ctx.translate(c, c); ctx.rotate(rot);
  PRIZES.forEach(function (p, i) {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, i * SEG, (i + 1) * SEG); ctx.closePath();
    ctx.fillStyle = p.color; ctx.fill();
    ctx.strokeStyle = '#ffe3b0'; ctx.lineWidth = 4; ctx.stroke();
    ctx.save(); ctx.rotate(i * SEG + SEG / 2);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff';
    ctx.font = '54px serif'; ctx.fillText(p.icon, r - 24, 4);
    ctx.font = '800 26px "Baloo 2", sans-serif'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 4;
    ctx.fillText(p.name, r - 92, 8);
    ctx.restore();
  });
  ctx.restore();
  ctx.beginPath(); ctx.arc(c, c, r + 6, 0, 7); ctx.lineWidth = 12; ctx.strokeStyle = '#ffe3b0'; ctx.stroke();
}

function pick() {
  var total = PRIZES.reduce(function (a, p) { return a + p.weight; }, 0), x = Math.random() * total;
  for (var i = 0; i < N; i++) { x -= PRIZES[i].weight; if (x < 0) return i; }
  return 0;
}

function spin() {
  if (spinning) return;
  spinning = true; document.getElementById('spin').disabled = true;
  var win = pick();
  var jitter = (Math.random() - .5) * SEG * .7;
  var target = -Math.PI / 2 - (win + .5) * SEG + jitter;
  var twoPi = 2 * Math.PI;
  var delta = (((target - rot) % twoPi) + twoPi) % twoPi + 6 * twoPi;
  var start = rot, t0 = performance.now(), dur = 5200;
  (function frame(now) {
    var k = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - k, 4);
    rot = start + delta * e; draw();
    if (k < 1) requestAnimationFrame(frame); else done(win);
  })(t0);
}

function done(i) {
  spinning = false; document.getElementById('spin').disabled = false;
  var p = PRIZES[i];
  state.count++; state.wins++;
  state.history.unshift({ icon:p.icon, name:p.name, time:new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }) });
  state.history = state.history.slice(0, 5);
  save(); render();
  document.getElementById('mIcon').textContent = p.icon;
  document.getElementById('mTitle').textContent = p.name + '!';
  document.getElementById('mText').textContent = 'Selamat, kamu memenangkan ' + p.name + '. Putar lagi untuk hadiah lainnya!';
  document.getElementById('modal').classList.add('show');
  document.getElementById('mClose').focus();
}

function render() {
  document.getElementById('count').textContent = state.count;
  document.getElementById('wins').textContent = state.wins;
  var ul = document.getElementById('history');
  ul.innerHTML = state.history.length
    ? state.history.map(function (h) { return '<li><span>' + h.icon + ' ' + h.name + '</span><span>' + h.time + '</span></li>'; }).join('')
    : '<li class="empty">Belum ada putaran. Ayo coba!</li>';
}

document.getElementById('spin').addEventListener('click', spin);
document.getElementById('mClose').addEventListener('click', function () { document.getElementById('modal').classList.remove('show'); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.getElementById('modal').classList.remove('show'); });

// gelembung latar
(function () {
  var b = document.getElementById('bubbles');
  for (var i = 0; i < 14; i++) {
    var d = document.createElement('i'), s = 8 + Math.random() * 26;
    d.style.cssText = 'left:' + Math.random() * 100 + '%;width:' + s + 'px;height:' + s + 'px;animation-duration:' + (9 + Math.random() * 14) + 's;animation-delay:-' + Math.random() * 20 + 's';
    b.appendChild(d);
  }
})();

draw(); render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>
</body>
</html>
